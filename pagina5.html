<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apresentação - Página 2</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="./assets/css/css.css" />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main>
      <div
        class="m-10 border-black border-2 p-10 bg-slate-100 h-[calc(100dvh-8rem)] shadow-[-3px_3px_0px_0px_#000]"
      >
        <img src="./assets/img/nize_new.png" alt="logo nize" class="w-20" />
 
        <div class="my-0 mx-auto w-[31%]">
          <h1
            class="text-center text-xl bg-[#bd87f4] self-center p-3 border-black border-2 shadow-[-3px_3px_0px_0px_#000] text-white mb-8"
          >
            Atores do sistema
          </h1>
        </div>

        <div
          class="grid grid-cols-3 gap-10 h-[75%] mt-5"
        >
          <div class="w-full">
            <h1
              class="text-center text-xl mt-5 bg-[#a9e879] self-center p-3 border-black border-2 shadow-[-3px_3px_0px_0px_#000] mb-8"
            >
              Administrador
            </h1>
            <p class="text-left h-[80px]">
              Ator interno, faz a gestão de usuários.
            </p>
          </div>

          <div class="w-full">
            <h1
              class="text-center text-xl mt-5 bg-[#a9e879] self-center p-3 border-black border-2 shadow-[-3px_3px_0px_0px_#000] mb-8"
            >
              Usuário
            </h1>
            <p class="text-left h-[80px]">
              Gestão de produtos e pedidos, bem como dos próprios dados
              cadastrais.
            </p>
          </div>

          <div class="w-full">
            <h1
              class="text-center text-xl mt-5 bg-[#a9e879] self-center p-3 border-black border-2 shadow-[-3px_3px_0px_0px_#000] mb-8"
            >
              Visitante
            </h1>
            <p class="text-left h-[80px]">
              Visualiza os produtos e poder fazer um pedido.
            </p>
          </div>
        </div>
      </div>

      <div class="flex flex-row justify-center">
        <a
          href="pagina4.html"
          class="bg-purple-700 p-2 text-white border-black border-2 align-bottom shadow-[-2px_2px_0px_0px_#000] mx-4 hover:bg-[#bd87f4]"
          ><i class="bi bi-arrow-left"></i
        ></a>
        <a
          href="pagina6.html"
          class="bg-purple-700 p-2 text-white border-black border-2 align-bottom shadow-[-2px_2px_0px_0px_#000] mx-4 hover:bg-[#bd87f4]"
          ><i class="bi bi-arrow-right"></i
        ></a>
      </div>
    </main>

</html>
