<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apresentação - Página 2</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="styles.js"></script>
  </head>
  <body>
    <main>
      <div
        class="m-10 border-black border-2 p-10 bg-slate-100 h-[calc(100dvh-8rem)] shadow-[-3px_3px_0px_0px_#000]"
      >
        <img src="nize_new.png" alt="logo nize" class="w-20" />

        <div class="grid grid-cols-3 items-center justify-center gap-10 h-[75%]">
          <div class="w-full">
            <h1
              class="text-center text-xl mt-5 bg-green-400 self-center p-3 border-black border-2 shadow-[-3px_3px_0px_0px_#000] mb-10"
            >
              O que é?
            </h1>
            <p class="text-left">Sistema de gestão para vendedores autônomos</p>
          </div>

          <div class="w-full">
            <h1
              class="text-center text-xl mt-5 bg-purple-400 self-center p-3 border-black border-2 shadow-[-3px_3px_0px_0px_#000] text-white mb-10"
            >
              Para quem é?
            </h1>
            <p class="text-left">
              Vendedores autônomos como artesãos, confeiteiros, sacoleiros, etc.
            </p>
          </div>

          <div class="w-full">
            <h1
              class="text-center text-xl mt-5 bg-green-400 self-center p-3 border-black border-2 shadow-[-3px_3px_0px_0px_#000] mb-10"
            >
              Por quê?
            </h1>
            <p class="text-left">
              Para centralizar produtos e pedidos, evitando uso de planilhas e
              cadernos
            </p>
          </div>
        </div>
      </div>

      <div class="flex flex-row justify-center">
        <a
          href="pagina1.html"
          class="bg-purple-700 p-2 text-white border-black border-2 align-bottom shadow-[-2px_2px_0px_0px_#000] mx-4 hover:bg-purple-400"
          ><i class="bi bi-arrow-left"></i
        ></a>
        <a
          href="pagina3.html"
          class="bg-purple-700 p-2 text-white border-black border-2 align-bottom shadow-[-2px_2px_0px_0px_#000] mx-4 hover:bg-purple-400"
          ><i class="bi bi-arrow-right"></i
        ></a>
      </div>
    </main>
  </body>
</html>
